<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accés — Espiadimonis de Felanitx</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/estils.css" rel="stylesheet">
</head>
<body class="bg-brand-black min-vh-100 d-flex align-items-center">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-lg border-0">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            {% load static %}
            <i class="bi bi-fire display-1 text-brand-red"></i>
            <h2 class="mt-2 fw-bold">Espiadimonis</h2>
            <p class="text-muted">Colla de Dimonis de Felanitx</p>
          </div>
          <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-danger">Correu o contrasenya incorrectes.</div>
            {% endif %}
            <div class="mb-3">
              <label class="form-label fw-semibold">Correu electrònic</label>
              <input type="email" name="username" class="form-control form-control-lg"
                     autocomplete="email" autofocus required
                     placeholder="el-teu@correu.com">
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Contrasenya</label>
              <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" class="btn btn-brand btn-lg w-100 fw-bold">
              <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
